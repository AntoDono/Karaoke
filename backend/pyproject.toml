[project]
name = "karaoke-backend"
version = "0.1.0"
description = "Karaoke analysis backend: vocal separation, pitch tracking, note quantization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "demucs>=4.0.0",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.0",
    "torch",
    "torchaudio",
    "torchfcpe",
]

[tool.uv]

# ── CUDA override (Linux/NVIDIA only — uncomment if running on a CUDA machine) ─
